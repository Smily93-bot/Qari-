          ICONEOF
          cat > app/src/main/res/values/styles.xml << 'STYLEEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#1E5C4F</item>
                  <item name="android:statusBarColor">#1E5C4F</item>
                  <item name="android:navigationBarColor">#14453B</item>
              </style>
          </resources>
          STYLEEOF
      - name: Build
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: qari-apk
          path: app/build/outputs/apk/release/app-release.apk
