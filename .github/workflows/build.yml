name: Build Qari APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Write project files
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/haya/qari app/src/main/res/drawable app/src/main/res/values
          cat > settings.gradle << 'SETEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Qari'
          include ':app'
          SETEOF
          cat > build.gradle << 'ROOTEOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          ROOTEOF
          cat > gradle.properties << 'PROPEOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          PROPEOF
          cat > app/build.gradle << 'APPEOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.haya.qari'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.haya.qari'
                  minSdk 24
                  targetSdk 34
                  versionCode 10
                  versionName '2.7'
              }
              signingConfigs {
                  release {
                      storeFile file('qari.keystore')
                      storePassword 'qari1234'
                      keyAlias 'qari'
                      keyPassword 'qari1234'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          APPEOF
          cat > app/src/main/AndroidManifest.xml << 'MANEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="Qari" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>
              </application>
          </manifest>
          MANEOF
          cat > app/src/main/java/com/haya/qari/MainActivity.java << 'MAINEOF'
          package com.haya.qari;
          
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsPromptResult;
          import android.webkit.JsResult;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.widget.EditText;
          
          public class MainActivity extends Activity {
              public static MainActivity active;
              private WebView web;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_REQ = 11;
          
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  active = this;
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
                  // Start the reading engine (background service) so it is ready before play
                  startService(new Intent(this, KeepAliveService.class).setAction("qari.INIT"));
          
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try { startActivityForResult(Intent.createChooser(i, "Open book"), FILE_REQ); }
                          catch (Exception e) { filePathCallback = null; return false; }
                          return true;
                      }
          
                      // A plain WebView shows no UI at all for alert()/confirm()/prompt()
                      // unless these are implemented — without them, every confirm()
                      // (like "Is this page Arabic only?") silently returns false.
                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setPositiveButton(android.R.string.ok, (d, w) -> result.confirm())
                                  .setOnCancelListener(d -> result.confirm())
                                  .setCancelable(false)
                                  .show();
                          return true;
                      }
          
                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setPositiveButton(android.R.string.ok, (d, w) -> result.confirm())
                                  .setNegativeButton(android.R.string.cancel, (d, w) -> result.cancel())
                                  .setOnCancelListener(d -> result.cancel())
                                  .show();
                          return true;
                      }
          
                      @Override
                      public boolean onJsPrompt(WebView view, String url, String message, String defaultValue, JsPromptResult result) {
                          final EditText input = new EditText(MainActivity.this);
                          if (defaultValue != null) input.setText(defaultValue);
                          new AlertDialog.Builder(MainActivity.this)
                                  .setMessage(message)
                                  .setView(input)
                                  .setPositiveButton(android.R.string.ok, (d, w) -> result.confirm(input.getText().toString()))
                                  .setNegativeButton(android.R.string.cancel, (d, w) -> result.cancel())
                                  .setOnCancelListener(d -> result.cancel())
                                  .show();
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "AndroidTTS");
                  web.loadUrl("file:///android_asset/qari.html");
                  setContentView(web);
              }
          
              public void js(final String code) {
                  runOnUiThread(() -> { if (web != null) web.evaluateJavascript(code, null); });
              }
          
              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FILE_REQ && filePathCallback != null) {
                      Uri[] out = null;
                      if (res == RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount();
                              out = new Uri[n];
                              for (int i = 0; i < n; i++) out[i] = data.getClipData().getItemAt(i).getUri();
                          } else if (data.getData() != null) {
                              out = new Uri[]{ data.getData() };
                          }
                      }
                      filePathCallback.onReceiveValue(out);
                      filePathCallback = null;
                  }
                  super.onActivityResult(req, res, data);
              }
          
              @Override
              public void onBackPressed() { moveTaskToBack(true); }
          
              @Override
              protected void onDestroy() {
                  if (active == this) active = null;
                  super.onDestroy();
              }
          
              private static KeepAliveService svc() { return KeepAliveService.active; }
          
              private class Bridge {
                  @JavascriptInterface
                  public void loadBook(String json, int startIndex, String lang, double rate, String voiceName, String title) {
                      if (svc() != null) svc().loadBook(json, startIndex, lang, rate, voiceName, title);
                  }
                  @JavascriptInterface
                  public void play() { if (svc() != null) svc().play(); }
                  @JavascriptInterface
                  public void pause() { if (svc() != null) svc().pause(); }
                  @JavascriptInterface
                  public void seek(int i) { if (svc() != null) svc().seek(i); }
                  @JavascriptInterface
                  public void setRate(double r) { if (svc() != null) svc().setRate(r); }
                  @JavascriptInterface
                  public void setVoice(String name) { if (svc() != null) svc().setVoiceName(name); }
                  @JavascriptInterface
                  public String getVoices(String lang) { return svc() != null ? svc().getVoicesJson(lang) : "[]"; }
                  @JavascriptInterface
                  public String getState() { return svc() != null ? svc().getStateJson() : "{}"; }
                  @JavascriptInterface
                  public int getSavedIndex(String title) { return svc() != null ? svc().getSavedIndex(title) : 0; }
                  @JavascriptInterface
                  public void dismiss() { if (svc() != null) svc().dismiss(); }
              }
          }
          MAINEOF
          cat > app/src/main/java/com/haya/qari/KeepAliveService.java << 'SVCEOF'
          package com.haya.qari;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.drawable.Icon;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          
          public class KeepAliveService extends Service {
              public static KeepAliveService active;
          
              private PowerManager.WakeLock lock;
              private MediaSession session;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private boolean pendingPlay = false;
          
              private final List<String> book = new ArrayList<>();
              private String title = "Qari";
              private int idx = 0;
              private boolean playing = false;
              private String lang = "ar";
              private float rate = 1f;
              private String voiceName = "";
              private boolean inForeground = false;
          
              @Override
              public void onCreate() {
                  super.onCreate();
                  active = this;
                  session = new MediaSession(this, "qari");
                  session.setCallback(new MediaSession.Callback() {
                      @Override public void onPlay() { play(); }
                      @Override public void onPause() { pause(); }
                      @Override public void onSkipToNext() { seek(idx + 1); }
                      @Override public void onSkipToPrevious() { seek(idx - 1); }
                  });
                  session.setActive(true);
          
                  tts = new TextToSpeech(this, status -> {
                      ttsReady = (status == TextToSpeech.SUCCESS);
                      if (ttsReady && pendingPlay) { pendingPlay = false; play(); }
                  });
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      @Override public void onStart(String id) {
                          try { idx = Integer.parseInt(id); } catch (Exception e) { return; }
                          persist();
                          js("window.__qariSyncIndex&&window.__qariSyncIndex(" + idx + ",true)");
                      }
                      @Override public void onDone(String id) {
                          int done;
                          try { done = Integer.parseInt(id); } catch (Exception e) { return; }
                          if (!playing) return;
                          if (done + 2 < book.size()) enqueue(done + 2, false);
                          if (done >= book.size() - 1) {
                              playing = false;
                              updateSession();
                              js("window.__qariNativeEnded&&window.__qariNativeEnded()");
                          }
                      }
                      @Override public void onError(String id) {
                          js("window.__qariNativeError&&window.__qariNativeError('tts')");
                      }
                  });
              }
          
              private void js(String code) {
                  if (MainActivity.active != null) MainActivity.active.js(code);
              }
          
              private SharedPreferences prefs() { return getSharedPreferences("qari", 0); }
              private void persist() { prefs().edit().putInt("pos-" + title, idx).apply(); }
          
              // ---------- public API used by the JS bridge ----------
              public void loadBook(String joinedSentences, int startIndex, String lg, double r, String vName, String t) {
                  book.clear();
                  if (joinedSentences != null && !joinedSentences.isEmpty()) {
                      for (String piece : joinedSentences.split("\u0001", -1)) {
                          if (piece != null && !piece.trim().isEmpty()) book.add(piece);
                      }
                  }
                  title = (t == null || t.isEmpty()) ? "Qari" : t;
                  idx = book.isEmpty() ? 0 : Math.max(0, Math.min(startIndex, book.size() - 1));
                  lang = lg;
                  rate = (float) r;
                  voiceName = vName == null ? "" : vName;
                  if (book.isEmpty()) {
                      js("window.__qariNativeError&&window.__qariNativeError('no readable sentences were received')");
                  }
              }
          
              public void play() {
                  if (book.isEmpty()) {
                      js("window.__qariNativeError&&window.__qariNativeError('nothing loaded to read')");
                      return;
                  }
                  if (!ttsReady) { pendingPlay = true; return; }
                  playing = true;
                  goForeground();
                  applyVoice();
                  tts.stop();
                  enqueue(idx, true);
                  if (idx + 1 < book.size()) enqueue(idx + 1, false);
                  updateSession();
              }
          
              public void pause() {
                  playing = false;
                  if (tts != null) tts.stop();
                  updateSession();
                  if (lock != null && lock.isHeld()) lock.release();
              }
          
              public void seek(int i) {
                  if (book.isEmpty()) return;
                  idx = Math.max(0, Math.min(i, book.size() - 1));
                  persist();
                  js("window.__qariSyncIndex&&window.__qariSyncIndex(" + idx + "," + playing + ")");
                  if (playing) {
                      tts.stop();
                      enqueue(idx, true);
                      if (idx + 1 < book.size()) enqueue(idx + 1, false);
                  }
              }
          
              public void setRate(double r) {
                  rate = (float) r;
                  if (playing) seek(idx);
              }
          
              public void setVoiceName(String v) {
                  voiceName = v == null ? "" : v;
                  if (playing) seek(idx);
              }
          
              public String getVoicesJson(String lg) {
                  char q = '"';
                  StringBuilder sb = new StringBuilder("[");
                  try {
                      if (ttsReady) {
                          boolean first = true;
                          for (Voice v : tts.getVoices()) {
                              if (v.getLocale() == null) continue;
                              if (!v.getLocale().getLanguage().startsWith(lg)) continue;
                              if (!first) sb.append(",");
                              first = false;
                              sb.append("{").append(q).append("name").append(q).append(":").append(q)
                                .append(v.getName().replace(String.valueOf(q), ""))
                                .append(q).append(",").append(q).append("quality").append(q).append(":")
                                .append(v.getQuality())
                                .append(",").append(q).append("network").append(q).append(":")
                                .append(v.isNetworkConnectionRequired())
                                .append("}");
                          }
                      }
                  } catch (Exception e) {}
                  sb.append("]");
                  return sb.toString();
              }
          
              public String getStateJson() {
                  char q = '"';
                  return "{" + q + "title" + q + ":" + q + title.replace(String.valueOf(q), "") + q
                          + "," + q + "index" + q + ":" + idx
                          + "," + q + "playing" + q + ":" + playing
                          + "," + q + "loaded" + q + ":" + (!book.isEmpty()) + "}";
              }
          
              public int getSavedIndex(String t) {
                  return prefs().getInt("pos-" + (t == null || t.isEmpty() ? "Qari" : t), 0);
              }
          
              public void dismiss() {
                  pause();
                  inForeground = false;
                  stopForeground(true);
                  stopSelf();
              }
          
              // ---------- internals ----------
              private void applyVoice() {
                  tts.setLanguage(lang.startsWith("ar") ? new Locale("ar") : Locale.US);
                  if (!voiceName.isEmpty()) {
                      try {
                          for (Voice v : tts.getVoices()) {
                              if (v.getName().equals(voiceName)) { tts.setVoice(v); break; }
                          }
                      } catch (Exception e) {}
                  }
                  tts.setSpeechRate(rate);
              }
          
              private void enqueue(int i, boolean flush) {
                  applyVoice();
                  tts.speak(book.get(i), flush ? TextToSpeech.QUEUE_FLUSH : TextToSpeech.QUEUE_ADD, null, String.valueOf(i));
              }
          
              private void goForeground() {
                  Notification n = buildNotif();
                  if (!inForeground) {
                      Intent i = new Intent(this, KeepAliveService.class).setAction("qari.FG");
                      if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
                  }
                  acquireLock();
              }
          
              private void updateSession() {
                  long acts = PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE
                          | PlaybackState.ACTION_PLAY_PAUSE
                          | PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS;
                  session.setPlaybackState(new PlaybackState.Builder()
                          .setActions(acts)
                          .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED, 0, 1f)
                          .build());
                  session.setMetadata(new MediaMetadata.Builder()
                          .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                          .putString(MediaMetadata.METADATA_KEY_ARTIST, "Qari")
                          .build());
                  if (inForeground) {
                      getSystemService(NotificationManager.class).notify(1, buildNotif());
                  }
              }
          
              private PendingIntent pi(String action, int req) {
                  Intent i = new Intent(this, KeepAliveService.class).setAction(action);
                  return PendingIntent.getService(this, req, i,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }
          
              private Notification buildNotif() {
                  String ch = "qari_play";
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel c = new NotificationChannel(ch, "Qari playback", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(c);
                  }
                  Notification.Builder nb = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(this, ch)
                          : new Notification.Builder(this);
                  int toggleIcon = playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play;
                  nb.setContentTitle(title)
                    .setContentText(playing ? "Qari يقرأ — Reading aloud" : "Paused — موقوف مؤقتاً")
                    .setSmallIcon(android.R.drawable.ic_media_play)
                    .setOngoing(playing)
                    .addAction(new Notification.Action.Builder(
                            Icon.createWithResource(this, android.R.drawable.ic_media_previous), "Prev", pi("qari.PREV", 1)).build())
                    .addAction(new Notification.Action.Builder(
                            Icon.createWithResource(this, toggleIcon), "Play/Pause", pi("qari.TOGGLE", 2)).build())
                    .addAction(new Notification.Action.Builder(
                            Icon.createWithResource(this, android.R.drawable.ic_media_next), "Next", pi("qari.NEXT", 3)).build())
                    .setStyle(new Notification.MediaStyle()
                            .setMediaSession(session.getSessionToken())
                            .setShowActionsInCompactView(0, 1, 2));
                  return nb.build();
              }
          
              private void acquireLock() {
                  if (lock == null) {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      lock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "qari:tts");
                      lock.setReferenceCounted(false);
                  }
                  lock.acquire(4 * 60 * 60 * 1000L);
              }
          
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String action = intent == null ? null : intent.getAction();
                  if ("qari.TOGGLE".equals(action)) { if (playing) pause(); else play(); return START_STICKY; }
                  if ("qari.NEXT".equals(action)) { seek(idx + 1); return START_STICKY; }
                  if ("qari.PREV".equals(action)) { seek(idx - 1); return START_STICKY; }
                  // "qari.FG" or a plain start: promote to foreground
                  Notification n = buildNotif();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  } else {
                      startForeground(1, n);
                  }
                  inForeground = true;
                  return START_STICKY;
              }
          
              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  // App swiped away from Recents: keep reading.
              }
          
              @Override
              public void onDestroy() {
                  if (lock != null && lock.isHeld()) lock.release();
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  if (session != null) { session.setActive(false); session.release(); }
                  active = null;
                  super.onDestroy();
              }
          
              @Override
              public IBinder onBind(Intent i) { return null; }
          }
          SVCEOF
          echo '' | base64 -d > app/src/main/assets/qari.html
          echo '' | base64 -d > app/qari.keystore
          cat > app/src/main/res/drawable/ic_launcher.xml << 'ICONEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
          
            <!-- background -->
            <path android:pathData="M24,0 L84,0 A24,24 0 0 1 108,24 L108,84 A24,24 0 0 1 84,108 L24,108 A24,24 0 0 1 0,84 L0,24 A24,24 0 0 1 24,0 Z"
                android:fillColor="#1E5C4F"/>
            <path android:pathData="M25.5,3 L82.5,3 A22.5,22.5 0 0 1 105,25.5 L105,82.5 A22.5,22.5 0 0 1 82.5,105 L25.5,105 A22.5,22.5 0 0 1 3,82.5 L3,25.5 A22.5,22.5 0 0 1 25.5,3 Z"
