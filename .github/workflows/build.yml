name: Build Qari APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Write project files
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/haya/qari
          cat > settings.gradle << 'SETEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Qari'
          include ':app'
          SETEOF
          cat > build.gradle << 'ROOTEOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          ROOTEOF
          cat > gradle.properties << 'PROPEOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          PROPEOF
          cat > app/build.gradle << 'APPEOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.haya.qari'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.haya.qari'
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName '2.0'
              }
              signingConfigs {
                  release {
                      storeFile file('qari.keystore')
                      storePassword 'qari1234'
                      keyAlias 'qari'
                      keyPassword 'qari1234'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          APPEOF
          cat > app/src/main/AndroidManifest.xml << 'MANEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="Qari" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>
              </application>
          </manifest>
          MANEOF
          cat > app/src/main/java/com/haya/qari/MainActivity.java << 'MAINEOF'
          package com.haya.qari;
          
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.speech.tts.UtteranceProgressListener;
          import android.speech.tts.Voice;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import java.util.Locale;
          
          public class MainActivity extends Activity {
              public static MainActivity active;
              private WebView web;
              private TextToSpeech tts;
              private boolean ttsReady = false;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_REQ = 11;
          
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  active = this;
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try { startActivityForResult(Intent.createChooser(i, "Open book"), FILE_REQ); }
                          catch (Exception e) { filePathCallback = null; return false; }
                          return true;
                      }
                  });
                  web.addJavascriptInterface(new Bridge(), "AndroidTTS");
                  web.loadUrl("file:///android_asset/qari.html");
                  setContentView(web);
          
                  tts = new TextToSpeech(this, status -> ttsReady = (status == TextToSpeech.SUCCESS));
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      @Override public void onStart(String id) { js("window.__qariNativeStart&&window.__qariNativeStart(" + id + ")"); }
                      @Override public void onDone(String id) { js("window.__qariNativeDone&&window.__qariNativeDone(" + id + ")"); }
                      @Override public void onError(String id) { js("window.__qariNativeError&&window.__qariNativeError('tts')"); }
                  });
              }
          
              public void js(final String code) {
                  runOnUiThread(() -> web.evaluateJavascript(code, null));
              }
          
              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == FILE_REQ && filePathCallback != null) {
                      Uri[] out = null;
                      if (res == RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              int n = data.getClipData().getItemCount();
                              out = new Uri[n];
                              for (int i = 0; i < n; i++) out[i] = data.getClipData().getItemAt(i).getUri();
                          } else if (data.getData() != null) {
                              out = new Uri[]{ data.getData() };
                          }
                      }
                      filePathCallback.onReceiveValue(out);
                      filePathCallback = null;
                  }
                  super.onActivityResult(req, res, data);
              }
          
              @Override
              public void onBackPressed() { moveTaskToBack(true); }
          
              @Override
              protected void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  stopService(new Intent(this, KeepAliveService.class));
                  if (active == this) active = null;
                  super.onDestroy();
              }
          
              private class Bridge {
                  @JavascriptInterface
                  public void speakId(String text, String lang, double rate, int id, boolean flush, String voiceName) {
                      if (!ttsReady) { js("window.__qariNativeError&&window.__qariNativeError('engine not ready')"); return; }
                      tts.setLanguage(lang.startsWith("ar") ? new Locale("ar") : Locale.US);
                      if (voiceName != null && !voiceName.isEmpty()) {
                          try {
                              for (Voice v : tts.getVoices()) {
                                  if (v.getName().equals(voiceName)) { tts.setVoice(v); break; }
                              }
                          } catch (Exception e) {}
                      }
                      tts.setSpeechRate((float) rate);
                      tts.speak(text, flush ? TextToSpeech.QUEUE_FLUSH : TextToSpeech.QUEUE_ADD, null, String.valueOf(id));
                  }
          
                  @JavascriptInterface
                  public String getVoices(String lang) {
                      char q = '"';
                      StringBuilder sb = new StringBuilder("[");
                      try {
                          if (ttsReady) {
                              boolean first = true;
                              for (Voice v : tts.getVoices()) {
                                  if (v.getLocale() == null) continue;
                                  if (!v.getLocale().getLanguage().startsWith(lang)) continue;
                                  if (!first) sb.append(",");
                                  first = false;
                                  sb.append("{").append(q).append("name").append(q).append(":").append(q)
                                    .append(v.getName().replace(String.valueOf(q), ""))
                                    .append(q).append(",").append(q).append("quality").append(q).append(":")
                                    .append(v.getQuality())
                                    .append(",").append(q).append("network").append(q).append(":")
                                    .append(v.isNetworkConnectionRequired())
                                    .append("}");
                              }
                          }
                      } catch (Exception e) {}
                      sb.append("]");
                      return sb.toString();
                  }
          
                  @JavascriptInterface
                  public void stop() { if (tts != null) tts.stop(); }
          
                  @JavascriptInterface
                  public void setPlaybackState(boolean p) {
                      if (KeepAliveService.active != null) KeepAliveService.active.setPlaying(p);
                  }
          
                  @JavascriptInterface
                  public void setForeground(boolean on, String title) {
                      Intent i = new Intent(MainActivity.this, KeepAliveService.class);
                      i.putExtra("title", title == null ? "Qari" : title);
                      if (on) {
                          if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
                      } else {
                          stopService(i);
                      }
                  }
              }
          }
          MAINEOF
          cat > app/src/main/java/com/haya/qari/KeepAliveService.java << 'SVCEOF'
          package com.haya.qari;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.drawable.Icon;
          import android.media.MediaMetadata;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          
          public class KeepAliveService extends Service {
              public static KeepAliveService active;
              private PowerManager.WakeLock lock;
              private MediaSession session;
              private String title = "Qari";
              private boolean playing = true;
          
              @Override
              public void onCreate() {
                  super.onCreate();
                  active = this;
                  session = new MediaSession(this, "qari");
                  session.setCallback(new MediaSession.Callback() {
                      @Override public void onPlay() { jsCall("window.__qariMediaToggle&&window.__qariMediaToggle()"); }
                      @Override public void onPause() { jsCall("window.__qariMediaToggle&&window.__qariMediaToggle()"); }
                      @Override public void onSkipToNext() { jsCall("window.__qariMediaNext&&window.__qariMediaNext()"); }
                      @Override public void onSkipToPrevious() { jsCall("window.__qariMediaPrev&&window.__qariMediaPrev()"); }
                  });
                  session.setActive(true);
              }
          
              private void jsCall(String code) {
                  if (MainActivity.active != null) MainActivity.active.js(code);
              }
          
              private void updateSession() {
                  long acts = PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE
                          | PlaybackState.ACTION_PLAY_PAUSE
                          | PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS;
                  session.setPlaybackState(new PlaybackState.Builder()
                          .setActions(acts)
                          .setState(playing ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED, 0, 1f)
                          .build());
                  session.setMetadata(new MediaMetadata.Builder()
                          .putString(MediaMetadata.METADATA_KEY_TITLE, title)
                          .putString(MediaMetadata.METADATA_KEY_ARTIST, "Qari")
                          .build());
              }
          
              private PendingIntent pi(String action, int req) {
                  Intent i = new Intent(this, KeepAliveService.class).setAction(action);
                  return PendingIntent.getService(this, req, i,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }
          
              private Notification buildNotif() {
                  String ch = "qari_play";
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel c = new NotificationChannel(ch, "Qari playback", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(c);
                  }
                  Notification.Builder nb = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(this, ch)
                          : new Notification.Builder(this);
                  int toggleIcon = playing ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play;
                  nb.setContentTitle(title)
                    .setContentText(playing ? "Qari يقرأ — Reading aloud" : "Paused — موقوف مؤقتاً")
                    .setSmallIcon(android.R.drawable.ic_media_play)
                    .setOngoing(playing)
                    .addAction(new Notification.Action.Builder(
                            Icon.createWithResource(this, android.R.drawable.ic_media_previous), "Prev", pi("qari.PREV", 1)).build())
                    .addAction(new Notification.Action.Builder(
                            Icon.createWithResource(this, toggleIcon), "Play/Pause", pi("qari.TOGGLE", 2)).build())
                    .addAction(new Notification.Action.Builder(
                            Icon.createWithResource(this, android.R.drawable.ic_media_next), "Next", pi("qari.NEXT", 3)).build())
                    .setStyle(new Notification.MediaStyle()
                            .setMediaSession(session.getSessionToken())
                            .setShowActionsInCompactView(0, 1, 2));
                  return nb.build();
              }
          
              public void setPlaying(boolean p) {
                  playing = p;
                  updateSession();
                  getSystemService(NotificationManager.class).notify(1, buildNotif());
                  if (p) {
                      acquireLock();
                  } else if (lock != null && lock.isHeld()) {
                      lock.release();
                  }
              }
          
              private void acquireLock() {
                  if (lock == null) {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      lock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "qari:tts");
                      lock.setReferenceCounted(false);
                  }
                  lock.acquire(4 * 60 * 60 * 1000L);
              }
          
              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String action = intent == null ? null : intent.getAction();
                  if (action != null) {
                      if (action.equals("qari.TOGGLE")) jsCall("window.__qariMediaToggle&&window.__qariMediaToggle()");
                      else if (action.equals("qari.NEXT")) jsCall("window.__qariMediaNext&&window.__qariMediaNext()");
                      else if (action.equals("qari.PREV")) jsCall("window.__qariMediaPrev&&window.__qariMediaPrev()");
                      return START_STICKY;
                  }
                  if (intent != null && intent.hasExtra("title")) title = intent.getStringExtra("title");
                  playing = true;
                  updateSession();
                  Notification n = buildNotif();
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                  } else {
                      startForeground(1, n);
                  }
                  acquireLock();
                  return START_STICKY;
              }
          
              @Override
              public void onDestroy() {
                  if (lock != null && lock.isHeld()) lock.release();
                  if (session != null) { session.setActive(false); session.release(); }
                  active = null;
                  super.onDestroy();
              }
          
              @Override
              public IBinder onBind(Intent i) { return null; }
          }
          SVCEOF
          echo '' | base64 -d > app/src/main/assets/qari.html
          echo '' | base64 -d > app/qari.keystore
      - name: Build
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: qari-apk
          path: app/build/outputs/apk/release/app-release.apk
